[phases.setup]
aptPkgs = ["ffmpeg", "libreoffice-writer", "libreoffice-calc", "libreoffice-impress", "libreoffice-draw", "poppler-utils", "tesseract-ocr", "tesseract-ocr-eng", "tesseract-ocr-deu", "python3", "python3-pil", "fontconfig", "fonts-dejavu-core", "ca-certificates"]

# Nixpacks 1.41 otherwise injects Corepack 0.24.1 and pnpm 9.
[phases.install]
cmds = ["npx --yes pnpm@11.18.0 install --frozen-lockfile"]

[phases.build]
cmds = ["npx --yes pnpm@11.18.0 run build"]

[start]
cmd = "node server.mjs"
